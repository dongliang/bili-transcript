name: CI & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- 1. 检查：不需要凭据，不联网 ----------
  check:
    name: 冒烟测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 跑冒烟测试
        run: node tests/ci-check.mjs

  # ---------- 2. 发布：只有版本号是新的才发 ----------
  publish:
    name: 发布到 npm
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # 用于 npm provenance 签名
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: 检查这个版本是否已发布
        id: v
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "name=$NAME"  >> "$GITHUB_OUTPUT"
          echo "ver=$VER"    >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER 已存在，跳过发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::准备发布 $NAME@$VER"
          fi

      - name: 发布
        if: steps.v.outputs.exists == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布后验证（从 registry 装下来跑一遍）
        if: steps.v.outputs.exists == 'false'
        run: |
          NAME="${{ steps.v.outputs.name }}"
          VER="${{ steps.v.outputs.ver }}"
          # registry 有传播延迟，刚发完立刻装会 ETARGET，必须轮询等待
          # registry 有传播延迟，实测最长约 3 分钟，这里给到 10 分钟
          echo "等待 $NAME@$VER 在 registry 生效…"
          for i in $(seq 1 60); do
            if npm view "$NAME@$VER" version >/dev/null 2>&1; then
              echo "  第 $i 次查询：已生效"
              break
            fi
            echo "  第 $i 次查询：还没生效，等 10 秒"
            sleep 10
          done
          if ! npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VER 在 10 分钟后仍未出现在 registry"
            exit 1
          fi

          cd /tmp && rm -rf verify && mkdir verify && cd verify
          npm install "$NAME@$VER"
          echo "--- 命令名检查 ---"
          ./node_modules/.bin/bili-transcript --version
          ./node_modules/.bin/bili --version
          echo "✅ 从 registry 安装并运行成功（两个命令名都可用）"
